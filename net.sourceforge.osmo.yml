app-id: net.sourceforge.osmo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
rename-desktop-file: osmo.desktop
rename-icon: osmo
command: osmo

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

cleanup:
  - '*.a'
  - '*.la'
  - /lib/pkgconfig
  - /include
  - /share/man

modules:
  - name: gspell
    buildsystem: meson
    config-opts:
      - -Dgspell_app=false
      - -Dgobject_introspection=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dtests=false
      - -Dinstall_tests=false
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gspell/1.14/gspell-1.14.5.tar.xz
        sha256: 788783b56fc3d03283b3aa29302d0b958aeca88835e10b1ec61f19e0efc7e8a4
        x-checker-data:
          type: gnome
          name: gspell
    modules:
      - name: enchant
        cleanup:
          - /bin
        sources:
          - type: archive
            url: https://github.com/AbiWord/enchant/releases/download/v2.8.21/enchant-2.8.21.tar.gz
            sha256: dd2a762697c463148a8f59867089a5ebf2dd1449d869f93764b76c12bcf8acc0
            x-checker-data:
              type: anitya
              project-id: 6601
              url-template: https://github.com/AbiWord/enchant/releases/download/v$version/enchant-$version.tar.gz

  - name: libical
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS:BOOL=ON
      - -DICAL_GLIB=true
      - -DGOBJECT_INTROSPECTION=true
      - -DICAL_GLIB_VAPI=false
      - -DICAL_BUILD_DOCS=false
      - -DLIBICAL_JAVA_BINDINGS=false
    cleanup:
      - /lib/cmake
    sources:
      - type: archive
        url: https://github.com/libical/libical/releases/download/v4.0.5/libical-4.0.5.tar.gz
        sha256: cc09a3ac41d60e6144e644bd3fcf97d47106d659c4a0b8965102581401e67c9c
        x-checker-data:
          type: anitya
          project-id: 1637
          url-template: https://github.com/libical/libical/releases/download/v$version/libical-$version.tar.gz

  - name: libmcrypt
    buildsystem: autotools
    config-opts:
      - --disable-static
    build-options:
      cflags: -Wno-error=implicit-function-declaration
    sources:
      - type: archive
        url: https://sourceforge.net/projects/mcrypt/files/Libmcrypt/2.5.8/libmcrypt-2.5.8.tar.gz
        sha256: e4eb6c074bbab168ac47b947c195ff8cef9d51a211cdd18ca9c9ef34d27a373e
      - type: patch
        paths:
          - patches/libmcrypt-0001-c99.patch
          - patches/libmcrypt-0002-prototypes.patch
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: mhash
    buildsystem: autotools
    config-opts:
      - --disable-static
    build-options:
      cflags: -std=gnu18
    sources:
      - type: archive
        url: https://sourceforge.net/projects/mhash/files/mhash/0.9.9.9/mhash-0.9.9.9.tar.bz2
        sha256: 56521c52a9033779154432d0ae47ad7198914785265e1f570cee21ab248dfef0
      - type: patch
        paths:
          - patches/mhash-0001-align.patch
          - patches/mhash-0002-force64bit-tiger.patch
          - patches/mhash-0003-fix-snefru-segfault.patch
          - patches/mhash-0004-fix-mem-leak.patch
          - patches/mhash-0005-fix-whirlpool-segfault.patch
          - patches/mhash-0006-autotools-namespace-stomping.patch
          - patches/mhash-0007-maxint.patch
          - patches/mhash-0008-alignment.patch
          - patches/mhash-0009-keygen_test_fix.patch
          - patches/mhash-0010-no-free-before-use.patch
          - patches/mhash-0011-cast-temp-64bit.patch
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: libgringotts
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/gringotts.berlios/libgringotts-1.2.1.tar.bz2
        sha256: a75e6f757b975d3da662fe7ea2d985f358f31ad2dede1a222bb4aa403d0dbfd1
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: osmo
    buildsystem: autotools
    autoreconf: true
    build-options:
      cflags: -Wno-error=implicit-function-declaration
    post-install:
      - install -Dm 644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/osmo-pim/osmo-pim/osmo-0.4.4/osmo-0.4.4.tar.gz
        sha256: 1e8b11bd1baa0f6756326b58f87eb95a56b38a25d7336fdfb65c2dfca46d03a6
        x-checker-data:
          type: anitya
          project-id: 2576
          url-template: https://downloads.sourceforge.net/project/osmo-pim/osmo-pim/osmo-$version/osmo-$version.tar.gz
      - type: patch
        paths:
          - patches/osmo-0001-gcc-15.patch
          - patches/osmo-0002-fix-delete-event-callback-return-type.patch
          - patches/osmo-0003-webkit4.1.patch
          - patches/osmo-0004-libical-4.patch
      - type: file
        path: net.sourceforge.osmo.metainfo.xml
      - type: shell
        commands:
          - touch configure aclocal.m4 Makefile.in
