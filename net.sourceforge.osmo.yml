app-id: net.sourceforge.osmo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
rename-desktop-file: osmo.desktop
rename-icon: osmo
command: osmo

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # Required by gspell
  - name: enchant
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/AbiWord/enchant/releases/download/v2.8.16/enchant-2.8.16.tar.gz
        sha256: d73162b5eff401a6397e1215e2b103bcef83f921c396c7f6b1394d2450d124e2
        x-checker-data:
          type: anitya
          project-id: 6601
          url-template: https://github.com/AbiWord/enchant/releases/download/v$version/enchant-$version.tar.gz

  - name: gspell
    buildsystem: meson
    config-opts:
      - -Dgspell_app=false
      - -Dgobject_introspection=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dtests=false
      - -Dinstall_tests=false
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gspell/1.14/gspell-1.14.3.tar.xz
        sha256: e8b39c67556f75495362952f81ca241b5a3c17c75960b77fc93fa702c612a5a4
        x-checker-data:
          type: gnome
          name: gspell

  - name: libical
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DBUILD_SHARED_LIBS=On
      - -DLIBICAL_BUILD_DOCS=False
      - -DLIBICAL_CXX_BINDINGS=False
      - -DLIBICAL_JAVA_BINDINGS=False
    cleanup:
      - /lib/cmake
    sources:
      - type: archive
        url: https://github.com/libical/libical/releases/download/v4.0.2/libical-4.0.2.tar.gz
        sha256: 39a979bb5474af3c4601c83dc71512c1121dee56722b3d8d8668ed75bd78ccdd
        x-checker-data:
          type: anitya
          project-id: 1637
          url-template: https://github.com/libical/libical/releases/download/v$version/libical-$version.tar.gz

  - name: libmcrypt
    buildsystem: autotools
    build-options:
      cflags: -Wno-implicit-function-declaration -Wno-implicit-int
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://sourceforge.net/projects/mcrypt/files/Libmcrypt/2.5.8/libmcrypt-2.5.8.tar.gz
        sha256: e4eb6c074bbab168ac47b947c195ff8cef9d51a211cdd18ca9c9ef34d27a373e
      - type: patch
        paths:
          - patches/libmcrypt-c23.patch
          - patches/libmcrypt-fix-enigma.patch
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: mhash
    buildsystem: autotools
    build-options:
      cflags: -std=gnu17
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://sourceforge.net/projects/mhash/files/mhash/0.9.9.9/mhash-0.9.9.9.tar.bz2
        sha256: 56521c52a9033779154432d0ae47ad7198914785265e1f570cee21ab248dfef0
        # Pathes are taken from Fedora: https://src.fedoraproject.org/rpms/mhash/blob/rawhide/f/mhash.spec
      - type: patch
        paths:
          - patches/mhash-0.9.9.9-align.patch
          - patches/mhash-0.9.9.9-force64bit-tiger.patch
          - patches/mhash-0.9.9.9-fix-snefru-segfault.patch
          - patches/mhash-0.9.9.9-fix-mem-leak.patch
          - patches/mhash-0.9.9.9-fix-whirlpool-segfault.patch
          - patches/mhash-0.9.9.9-autotools-namespace-stomping.patch
          - patches/mhash-0.9.9.9-maxint.patch
          - patches/mhash-0.9.9.9-alignment.patch
          - patches/mhash-0.9.9.9-keygen_test_fix.patch
          - patches/mhash-0.9.9-no-free-before-use.patch
          - patches/mhash-0.9.9.9-cast-temp-64bit.patch
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: libgringotts
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/gringotts.berlios/libgringotts-1.2.1.tar.bz2
        sha256: a75e6f757b975d3da662fe7ea2d985f358f31ad2dede1a222bb4aa403d0dbfd1
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: osmo
    buildsystem: autotools
    build-options:
      cflags: -Wno-implicit-function-declaration
    post-install:
      - install -Dm 644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/osmo-pim/osmo-pim/osmo-0.4.4/osmo-0.4.4.tar.gz
        sha256: 1e8b11bd1baa0f6756326b58f87eb95a56b38a25d7336fdfb65c2dfca46d03a6
        x-checker-data:
          type: anitya
          project-id: 2576
          url-template: https://downloads.sourceforge.net/project/osmo-pim/osmo-pim/osmo-$version/osmo-$version.tar.gz
      - type: patch
        paths:
          - patches/osmo-gcc-15.patch
          - patches/osmo-libxml2.patch
      - type: shell
        commands:
          - sed -i configure.ac -e 's|webkit2gtk-4.0|webkit2gtk-4.1|'
          - autoreconf -vif
      - type: file
        path: net.sourceforge.osmo.metainfo.xml
